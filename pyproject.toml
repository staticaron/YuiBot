[project]
name = "yuibot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "staticaron", email = "static.aron@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
    "cryptography>=50.0.2",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "py-cord>=2.8.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.20.0",
    "python-youtube>=0.9.9",
    "spotipy>=2.26.0",
    "tracemoepy>=4.1",
    "uv>=0.13.8",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
yuibot = "yuibot:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
